name: Daily Event Scrape

on:
  schedule:
    # Run daily at 8:00 AM NZST (20:00 UTC previous day)
    - cron: '0 20 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (with AI scoring)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.cli --verbose --limit 50

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: events-${{ github.run_id }}
          path: output/*.json
          retention-days: 30

      - name: Commit results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.json
          git diff --staged --quiet || git commit -m "chore: daily scrape $(date +%Y-%m-%d)"
          git push
